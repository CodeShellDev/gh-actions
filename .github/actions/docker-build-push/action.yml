name: Docker Build & Push
description: Builds and pushes a (multi-arch) Docker image

inputs:
  registry:
    required: true

  username:
    required: false
    default: ""

  token:
    required: true

  image:
    required: false
    default: ""

  context:
    default: .

  platforms:
    description: Comma-separated os/arch pairs
    default: linux/amd64,linux/arm64

  flavor:
    default: |
      latest=true

  tags:
    default: |
      type=semver,pattern=v{{version}}
      type=semver,pattern=v{{major}}.{{minor}}
      type=semver,pattern=v{{major}}

  use-qemu:
    default: "false"

  push:
    default: "true"

  cache:
    default: "true"

  build-args:
    default: ""

outputs:
  tags:
    value: ${{ steps.meta.outputs.tags }}
  version:
    value: ${{ steps.meta.outputs.version }}

runs:
  using: composite
  steps:
    - uses: docker/login-action@v3
      with:
        registry: ${{ inputs.registry }}
        username: ${{ inputs.username || github.repository_owner }}
        password: ${{ inputs.token }}

    - if: inputs.use-qemu == 'true'
      uses: docker/setup-qemu-action@v3

    - uses: docker/setup-buildx-action@v3

    - id: meta
      uses: docker/metadata-action@v5
      with:
        images: ${{ inputs.registry }}/${{ inputs.image || github.repository }}
        flavor: ${{ inputs.flavor }}
        tags: ${{ inputs.tags }}

    - id: build-meta
      shell: bash
      run: |
        echo "build_time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
        echo "git_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        echo "git_commit_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
        echo "git_branch=$(git rev-parse --abbrev-ref HEAD)" >> "$GITHUB_OUTPUT"

    - uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        platforms: ${{ inputs.platforms }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        push: ${{ inputs.push }}
        cache-from: ${{ inputs.cache == 'true' && 'type=gha' || '' }}
        cache-to: ${{ inputs.cache == 'true' && 'type=gha,mode=max' || '' }}
        build-args: |
          IMAGE_TAG=${{ steps.meta.outputs.version }}
          BUILD_TIME=${{ steps.build-meta.outputs.build_time }}
          GIT_COMMIT=${{ steps.build-meta.outputs.git_commit }}
          GIT_COMMIT_SHORT=${{ steps.build-meta.outputs.git_commit_short }}
          GIT_BRANCH=${{ steps.build-meta.outputs.git_branch }}
          REPOSITORY_URL=https://github.com/${{ github.repository }}
          REPOSITORY=${{ github.repository }}
          REPOSITORY_OWNER=${{ github.repository_owner }}
          WORKFLOW=${{ github.workflow }}
          RUN_ID=${{ github.run_id }}
          RUN_NUMBER=${{ github.run_number }}
          ACTOR=${{ github.actor }}
          REF=${{ github.ref }}
          REF_NAME=${{ github.ref_name }}
          SHA=${{ github.sha }}

          ${{ inputs.build-args }}
